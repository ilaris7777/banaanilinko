<!doctype html>
<html lang="fi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Banaanilinko</title>
<style>html,body{margin:0;padding:0}</style>
</head>
<body>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@700;900&display=swap">
<style>
/* Asettelu: koko ruudun canvas, päällä HUD-merkit ylhäällä, vihjepalkki alhaalla ja tuloskortti keskellä. Yksi teema (viidakon auringonlasku). */
:root{
  --ink:#2b1a10; --paper:#fff3d0; --banana:#ffd92e; --leaf:#4fae45; --berry:#e8493c; --wood:#b8743a; --dusk:#f08a24;
  --display:'Lilita One','Arial Rounded MT Bold','Trebuchet MS',system-ui,sans-serif;
  --body:'Nunito','Trebuchet MS',system-ui,sans-serif;
  color-scheme:light;
}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--ink);color:var(--ink);font-family:var(--body);font-weight:700;overflow:hidden;overscroll-behavior:none;-webkit-user-select:none;user-select:none}
#stage{position:relative;height:100%;overflow:hidden;background:var(--dusk)}
#c{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
#c.pull{cursor:grabbing}
#hud{position:absolute;top:0;left:0;right:0;display:flex;flex-wrap:wrap;gap:8px;padding-block:10px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));pointer-events:none}
.chip{display:flex;align-items:baseline;gap:7px;background:var(--paper);border:3px solid var(--ink);border-radius:13px;
  padding:3px 11px 4px;box-shadow:0 4px 0 var(--ink);font-size:13px;letter-spacing:.02em}
.chip b{font-family:var(--display);font-weight:400;font-size:20px;font-variant-numeric:tabular-nums;letter-spacing:.01em}
.chip.value{background:var(--banana)}
.chip.best{margin-left:auto;background:#ffe9b0}
#tip{position:absolute;left:0;right:0;bottom:0;display:flex;justify-content:center;padding-block:12px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));pointer-events:none;transition:opacity .4s}
#tip span{background:var(--ink);color:var(--paper);border-radius:12px;padding:7px 14px;font-size:15px;text-align:center;max-width:46rem;text-wrap:balance}
#tip.off{opacity:0}
#card,#menu,#scores{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(43,26,16,.55);
  padding-block:16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.panel{background:var(--paper);border:5px solid var(--ink);border-radius:22px;box-shadow:0 9px 0 var(--ink);padding:20px 26px 24px;
  width:min(100%,400px);max-height:100%;overflow:auto;text-align:center;display:flex;flex-direction:column;gap:12px}
.panel h2{font-family:var(--display);font-weight:400;font-size:34px;line-height:1.05;margin:0;text-wrap:balance}
#cStars{font-size:50px;line-height:1;letter-spacing:6px;color:#d9c59a;-webkit-text-stroke:3px var(--ink);paint-order:stroke fill}
#cStars .on{color:var(--banana)}
#cStats{display:grid;grid-template-columns:1fr auto;gap:5px 16px;margin:0;text-align:left;font-size:16px}
#cStats dt{margin:0}
#cStats dd{margin:0;font-family:var(--display);font-weight:400;font-size:20px;text-align:right;font-variant-numeric:tabular-nums}
#cNote{font-size:14px;color:#7a4a22;min-height:1em}
.btn{font-family:var(--display);font-size:22px;color:var(--ink);background:var(--leaf);border:4px solid var(--ink);border-radius:15px;
  padding:10px 18px;box-shadow:0 5px 0 var(--ink);cursor:pointer}
.btn:hover{filter:brightness(1.08)}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
.btn:focus-visible,.world:focus-visible,.tab:focus-visible,#nameInput:focus-visible,#hMenu:focus-visible{outline:4px solid var(--berry);outline-offset:3px}
.btn.alt{background:var(--banana)}
#hMenu{pointer-events:auto;cursor:pointer;font:inherit;font-size:13px;font-weight:700;color:var(--ink)}
#hMenu:hover{filter:brightness(1.06)}
/* Aloitusruutu */
.menuBox{width:min(100%,1000px);max-height:100%;overflow:auto;display:flex;flex-direction:column;align-items:center;gap:16px;text-align:center;padding:6px 6px 10px}
.menuBox h1{font-family:var(--display);font-weight:400;font-size:clamp(44px,9vw,92px);line-height:1;margin:0;color:var(--banana);
  -webkit-text-stroke:7px var(--ink);paint-order:stroke fill;text-shadow:0 8px 0 var(--ink);letter-spacing:.01em}
.menuBox .sub{margin:0;color:var(--paper);font-size:16px;text-wrap:balance}
.worlds{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;width:100%}
.world{font:inherit;color:var(--ink);background:var(--paper);border:4px solid var(--ink);border-radius:16px;box-shadow:0 6px 0 var(--ink);
  padding:0;overflow:hidden;cursor:pointer;display:flex;flex-direction:column;text-align:left;min-width:0}
.world canvas{display:block;width:100%;aspect-ratio:16/9;border-bottom:4px solid var(--ink)}
.world .wn{font-family:var(--display);font-size:22px;line-height:1.1;padding:7px 10px 0}
.world .ws{font-size:12.5px;line-height:1.25;padding:2px 10px 9px;color:#7a4a22;min-height:2.6em}
.world:hover:not(:disabled){filter:brightness(1.06);transform:translateY(-2px)}
.world:active:not(:disabled){transform:translateY(4px);box-shadow:0 2px 0 var(--ink)}
.world:disabled{cursor:not-allowed;background:#d9c59a}
/* Ennätyslista */
.panel.wide{width:min(100%,520px)}
.tabs{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.tab{font:inherit;font-size:14px;color:var(--ink);background:#ffe9b0;border:3px solid var(--ink);border-radius:11px;padding:4px 10px;cursor:pointer}
.tab[aria-selected="true"]{background:var(--banana);box-shadow:0 3px 0 var(--ink)}
#scoreList{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;text-align:left}
#scoreList li{display:grid;grid-template-columns:2em 1fr auto;align-items:baseline;gap:8px;background:#ffe9b0;border:3px solid var(--ink);
  border-radius:11px;padding:5px 12px;font-size:16px;min-width:0}
#scoreList li span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#scoreList li b{font-family:var(--display);font-weight:400;font-size:21px;font-variant-numeric:tabular-nums}
#scoreList li.me{background:var(--banana)}
.snote{margin:0;font-size:13px;color:#7a4a22;min-height:1.2em;text-wrap:balance}
#scoreList li.empty{color:#a08660;background:transparent;border-style:dashed}
#cName{display:flex;flex-direction:column;gap:6px;text-align:left;font-size:14px}
#nameInput{font:inherit;font-size:18px;color:var(--ink);background:#fff;border:3px solid var(--ink);border-radius:11px;padding:7px 10px;
  -webkit-user-select:text;user-select:text;min-width:0}
@media (max-width:560px){.worlds{grid-template-columns:repeat(2,1fr);gap:10px}.world .wn{font-size:18px}.chip{font-size:11px;padding:2px 8px 3px}.chip b{font-size:16px}#tip span{font-size:13px}}
</style>

<div id="stage">
  <canvas id="c" aria-label="Banaanilingon pelialue"></canvas>
  <div id="hud" hidden>
    <div class="chip"><span id="hWorld">Viidakko</span><b id="hLevel">1/12</b></div>
    <div class="chip"><span>Yritys</span><b id="hTry">1</b></div>
    <div class="chip value"><span>Tason arvo</span><b id="hVal">1000</b></div>
    <div class="chip"><span>Yhteensä</span><b id="hTotal">0</b></div>
    <div class="chip best"><span>Tason ennätys</span><b id="hBest">–</b></div>
    <button id="hMenu" class="chip" type="button">Valikko</button>
  </div>
  <div id="tip"><span id="tipText"></span></div>
  <div id="card" hidden>
    <div class="panel">
      <h2 id="cTitle"></h2>
      <div id="cStars" aria-hidden="true"></div>
      <dl id="cStats"></dl>
      <div id="cNote"></div>
      <div id="cName" hidden>
        <label for="nameInput">Pääsit ennätyslistalle! Kirjoita nimesi:</label>
        <input id="nameInput" type="text" maxlength="12" autocomplete="off" spellcheck="false">
      </div>
      <button id="cBtn" class="btn" type="button"></button>
    </div>
  </div>
  <div id="menu">
    <div class="menuBox">
      <h1>Banaanilinko</h1>
      <p class="sub">Valitse maailma. Kun läpäiset kaikki 12 tasoa, seuraava maailma aukeaa.</p>
      <div id="worlds" class="worlds"></div>
      <button id="btnScores" class="btn alt" type="button">Ennätykset</button>
    </div>
  </div>
  <div id="scores" hidden>
    <div class="panel wide">
      <h2>Ennätykset</h2>
      <div id="scoreTabs" class="tabs" role="tablist"></div>
      <p id="scoreNote" class="snote" aria-live="polite"></p>
      <ol id="scoreList"></ol>
      <button id="btnBack" class="btn" type="button">Takaisin valikkoon</button>
    </div>
  </div>
</div>

/* Banaanin muoto: ympyröitä kaarella -> kaareva törmäysmuoto ilman omaa törmäyskoodia */
const BAN = { R: CONFIG.banana.arcRadius, half: CONFIG.banana.arcHalf, Lh: CONFIG.banana.arcRadius * CONFIG.banana.arcHalf,
  radii: [7.5, 10, 12, 13, 13.5, 13, 12, 10, 7.5], parts: [], s: [], raw0: [], cur: [], ox: 0, oy: 0 };
BAN.s = BAN.radii.map((r, i) => (-BAN.half + 2 * BAN.half * i / (BAN.radii.length - 1)) * BAN.R);   // osien paikat kaarta pitkin (px keskeltä)

/* Taipuvan banaanin keskiviiva: piste kohdassa s (px keskeltä kaarta pitkin) ja selän suuntainen normaali.
   curl muuttaa koko kaaren kaarevuutta, wave tekee toisesta päästä kaarevamman ja toisesta suoremman. */
function flexRaw(curl, wave, s) {
  const k1 = (1 + curl) / BAN.R, k2 = wave / (2 * BAN.R * BAN.Lh), n = Math.max(2, Math.ceil(Math.abs(s) / 4)), ds = s / n;
  let x = 0, y = BAN.R, t = 0;
  for (let i = 0; i < n; i++) { const m = t + ds / 2, ph = k1 * m + k2 * m * m; x += Math.cos(ph) * ds; y -= Math.sin(ph) * ds; t += ds; }
  const ph = k1 * s + k2 * s * s;
  return { x, y, nx: Math.sin(ph), ny: Math.cos(ph) };
}
/* Sama banaanin omassa koordinaatistossa (origo massakeskipisteessä). Taipuminen ei siirrä painopistettä. */
function flexLocal(curl, wave, sArr) {
  let cx = 0, cy = 0, m = 0;
  if (curl || wave) {
    for (let i = 0; i < BAN.s.length; i++) { const p = flexRaw(curl, wave, BAN.s[i]), q = BAN.raw0[i], wt = BAN.radii[i] * BAN.radii[i]; cx += (p.x - q.x) * wt; cy += (p.y - q.y) * wt; m += wt; }
    cx /= m; cy /= m;
  }
  return sArr.map(sv => { const p = flexRaw(curl, wave, sv); p.x += BAN.ox - cx; p.y += BAN.oy - cy; return p; });
}

function makeBanana() {
  const parts = [], n = BAN.radii.length;
  for (let i = 0; i < n; i++) {
    const th = -BAN.half + 2 * BAN.half * i / (n - 1);
    parts.push(Bodies.circle(BAN.R * Math.sin(th), BAN.R * Math.cos(th), BAN.radii[i], { density: CONFIG.banana.density }));
  }
  const b = Body.create({
    parts, friction: CONFIG.banana.friction, restitution: CONFIG.banana.restitution,
    frictionAir: CONFIG.physics.airFriction, frictionStatic: 0.6,
    collisionFilter: { category: CAT.BANANA, mask: 0xFFFFFFFF },
  });
  // Osien paikat massakeskipisteen suhteen (vierintää ja piirtoa varten)
  BAN.parts = b.parts.slice(1).map(p => ({ x: p.position.x - b.position.x, y: p.position.y - b.position.y, r: p.circleRadius }));
  // Väljä ulkokuori: moottori käyttää sitä vain karkeaan osumahakuun, joten taipuneetkin osat mahtuvat sen sisään
  Matter.Vertices.scale(b.vertices, 1.4, 1.4, b.position); Matter.Bounds.update(b.bounds, b.vertices, b.velocity);
  BAN.raw0 = BAN.s.map(sv => flexRaw(0, 0, sv));
  const mid = BAN.parts.length >> 1;
  BAN.ox = BAN.parts[mid].x - BAN.raw0[mid].x; BAN.oy = BAN.parts[mid].y - BAN.raw0[mid].y;
  BAN.cur = flexLocal(0, 0, BAN.s);
  return b;
}

/* Lötköys: taipuma on kaksi hidasta, vaimenevaa jousta. Törmäysosat siirretään joka askeleella taipuneen
   muodon mukaisiksi, joten banaani myös osuu ja pomppaa muuttuneen muotonsa mukaan. */
function stepFlex(ban) {
  const FL = CONFIG.banana.flop, f = G.flex, w1 = 2 * Math.PI * FL.curlHz, w2 = 2 * Math.PI * FL.waveHz;
  f.vc += (-w1 * w1 * f.curl - 2 * FL.damping * w1 * f.vc) * DT; f.curl = clamp(f.curl + f.vc * DT, -FL.maxCurl, FL.maxCurl);
  f.vw += (-w2 * w2 * f.wave - 2 * FL.damping * w2 * f.vw) * DT; f.wave = clamp(f.wave + f.vw * DT, -FL.maxWave, FL.maxWave);
  const pts = flexLocal(f.curl, f.wave, BAN.s), sn = Math.sin(ban.angle), cs = Math.cos(ban.angle);
  for (let i = 0; i < pts.length; i++) {
    const part = ban.parts[i + 1], tx = ban.position.x + pts[i].x * cs - pts[i].y * sn, ty = ban.position.y + pts[i].x * sn + pts[i].y * cs;
    Matter.Vertices.translate(part.vertices, { x: tx - part.position.x, y: ty - part.position.y });
    part.position.x = tx; part.position.y = ty;
    Matter.Bounds.update(part.bounds, part.vertices, ban.velocity);
  }
  BAN.cur = pts;
}
/* Osuma taivuttaa: keskelle selkään osuva isku suoristaa, päihin osuva koukistaa ja vinot iskut panevat banaanin aaltoilemaan */
function flexKick(ban, other, pair, boost) {
  const q = pair.collision.supports && pair.collision.supports[0]; if (!q) return;
  const FL = CONFIG.banana.flop, rx = q.x - ban.position.x, ry = q.y - ban.position.y;
  // Suhteellinen nopeus kosketuspisteessä (px/askel)
  const vx = ban.velocity.x - ban.angularVelocity * ry - (other.position.x - other.positionPrev.x);
  const vy = ban.velocity.y + ban.angularVelocity * rx - (other.position.y - other.positionPrev.y);
  if (Math.hypot(vx, vy) < FL.minHit) return;
  const sn = Math.sin(ban.angle), cs = Math.cos(ban.angle), lx = rx * cs + ry * sn, ly = -rx * sn + ry * cs;
  let bi = 0, bd = 1e9;
  for (let i = 0; i < BAN.cur.length; i++) { const d = Math.hypot(lx - BAN.cur[i].x, ly - BAN.cur[i].y); if (d < bd) { bd = d; bi = i; } }
  const pt = BAN.cur[bi], u = BAN.s[bi] / BAN.Lh;
  const fx = -(vx * cs + vy * sn), fy = -(-vx * sn + vy * cs);          // iskun suunta banaanin koordinaatistossa
  const fin = -(fx * pt.nx + fy * pt.ny), ftan = fx * pt.ny - fy * pt.nx; // selästä sisäänpäin ja pituussuuntaan
  const kc = FL.gain * boost * fin * (2 * u * u - 1), kw = FL.gain * boost * (fin * u * 1.2 + ftan * 0.35);
  G.flex.vc += kc; G.flex.vw += kw;
  // Osa iskusta näkyy muodossa välittömästi, loppu jää heilumaan
  G.flex.curl = clamp(G.flex.curl + kc * FL.snap, -FL.maxCurl, FL.maxCurl);
  G.flex.wave = clamp(G.flex.wave + kw * FL.snap, -FL.maxWave, FL.maxWave);
}

/* Banaanin alin kohta annetussa asennossa (etäisyys keskipisteestä alaspäin) */
function bananaLowest(angle) {
  const s = Math.sin(angle), c = Math.cos(angle); let m = -1e9;
  for (const p of BAN.parts) m = Math.max(m, p.x * s + p.y * c + p.r);
  return m;
}

/* Osuiko kosketus banaanin selkäpuolelle eli ulkokaareen? (kosketuspiste lähimmän osan selän puolella) */
function bananaBackHit(ban, collision) {
  const q = collision.supports && collision.supports[0]; if (!q) return false;
  const sn = Math.sin(ban.angle), cs = Math.cos(ban.angle), rx = q.x - ban.position.x, ry = q.y - ban.position.y;
  const lx = rx * cs + ry * sn, ly = -rx * sn + ry * cs;
  let best = BAN.cur[0], bd = 1e9;
  for (const pt of BAN.cur) { const d = Math.hypot(lx - pt.x, ly - pt.y); if (d < bd) { bd = d; best = pt; } }
  const out = (lx - best.x) * best.nx + (ly - best.y) * best.ny, along = Math.abs((lx - best.x) * best.ny - (ly - best.y) * best.nx);
  return out > 2 && along < 11;
}
/* Törmäykset laskee edelleen Matter.js. Tässä valitaan vain, mitä kimmoisuuskerrointa moottori käyttää
   banaanin kosketuksille: selkäpuoli pomppaa eniten, korin seinät vähiten. */
if (!Matter.Pair.__banaanilinko) {
  const basePairUpdate = Matter.Pair.update;
  Matter.Pair.update = function (pair, collision, timestamp) {
    basePairUpdate(pair, collision, timestamp);
    if (Matter.Pair.__banaaniHook) Matter.Pair.__banaaniHook(pair, collision);
  };
  Matter.Pair.__banaanilinko = true;
}
Matter.Pair.__banaaniHook = (pair, collision) => {
  const ban = G.banana; if (!ban) return;
  const a = collision.parentA, b = collision.parentB;
  if (a !== ban && b !== ban) return;
  const other = a === ban ? b : a;
  if (other === S.pouch) return;
  pair.isBackHit = bananaBackHit(ban, collision);
  const e = pair.isBackHit ? CONFIG.banana.backRestitution : CONFIG.banana.restitution;
  // bounceCap = pinta, joka ei pomputa (korin seinät, hiekka, kaktus)
  pair.restitution = other.bounceCap !== undefined ? Math.min(e, other.bounceCap) : Math.max(e, other.restitution);
};

function addItem(kind, body, extra) {
  const bodies = Array.isArray(body) ? body : [body];
  Composite.add(world, bodies);
  const it = Object.assign({ kind, body: bodies[0], bodies, init: bodies.map(b => ({ x: b.position.x, y: b.position.y, a: b.angle })) }, extra || {});
  L.items.push(it);
  return it;
}

/* Ämpärin kolme seinää staattisina kappaleina */
function bucketBodies(x, by, wt, wb, h) {
  const t = CONFIG.bucket.wall, st = { isStatic: true, friction: 0.8, restitution: 0.05, bounceCap: CONFIG.bucket.restitution };
  const wall = (xa, ya, xb, yb) => Bodies.rectangle((xa + xb) / 2, (ya + yb) / 2, Math.hypot(xb - xa, yb - ya), t, Object.assign({ angle: Math.atan2(yb - ya, xb - xa) }, st));
  return [Bodies.rectangle(x, by - t / 2, wb + t, t, st), wall(x - wb / 2, by, x - wt / 2, by - h), wall(x + wb / 2, by, x + wt / 2, by - h)];
}

function buildLevel(def) {
  engine = Engine.create();
  const WP = Object.assign({ gravity: CONFIG.physics.gravity, groundFriction: 0.8, groundRestitution: 0.12 }, CONFIG.worlds[curWorld().theme]);
  engine.gravity.y = WP.gravity;
  engine.positionIterations = 8; engine.velocityIterations = 6; engine.constraintIterations = 2;
  world = engine.world;
  L.items = []; L.gears = []; L.movers = []; L.sprinklers = []; L.buckets = []; L.def = def;

  // Maa (osissa, jotta väliin jää vettä)
  for (const [x1, x2] of def.ground) {
    const a = x1 <= 0 ? -700 : x1, b = x2 >= W ? W + 700 : x2;
    const gopt = { isStatic: true, friction: WP.groundFriction, restitution: WP.groundRestitution };
    if (WP.groundBounceCap !== undefined) gopt.bounceCap = WP.groundBounceCap;
    addItem('ground', Bodies.rectangle((a + b) / 2, GY + 150, b - a, 300, gopt));
  }
  // Ramppi, jota pitkin banaani vierii lingolle
  const R = CONFIG.ramp;
  addItem('ramp', Bodies.rectangle((R.x1 + R.x2) / 2, R.y + R.thick / 2, R.x2 - R.x1, R.thick, { isStatic: true, friction: 0.6, restitution: 0.1 }));

  // Tason palikat
  for (const o of def.objects) {
    if (o.t === 'crate') { const s = o.s || 64; addItem('crate', Bodies.rectangle(o.x, o.y, s, s, { density: 0.0009, friction: 0.6, restitution: 0.1 }), { s, dyn: true }); }
    else if (o.t === 'barrel') addItem('barrel', Bodies.rectangle(o.x, o.y, 56, 76, { chamfer: { radius: 12 }, density: 0.0018, friction: 0.6, restitution: 0.15 }), { dyn: true });
    else if (o.t === 'rock') addItem('rock', Bodies.polygon(o.x, o.y, 7, o.r, { isStatic: true, friction: 0.7, restitution: 0.15, angle: 0.25 }));
    else if (o.t === 'plank') addItem('plank', Bodies.rectangle(o.x, o.y, o.w, o.h, { isStatic: true, angle: o.a || 0, friction: o.ice ? CONFIG.ice.friction : 0.5, restitution: 0.2 }), { w: o.w, h: o.h, ice: !!o.ice });
    else if (o.t === 'tramp') addItem('tramp', Bodies.rectangle(o.x, o.y + 8, o.w, 16, { isStatic: true, restitution: CONFIG.trampoline.restitution, friction: 0.2 }), { w: o.w, x: o.x, y: o.y, squash: 0 });
    else if (o.t === 'gear') {
      const parts = [Bodies.circle(0, 0, o.r * 0.8)], n = 8;
      for (let k = 0; k < n; k++) { const a = k * Math.PI * 2 / n; parts.push(Bodies.rectangle(Math.cos(a) * o.r * 0.88, Math.sin(a) * o.r * 0.88, o.r * 0.34, o.r * 0.3, { angle: a })); }
      const g = Body.create({ parts, isStatic: true, friction: 0.7, restitution: 0.3 });
      Body.setPosition(g, { x: o.x, y: o.y });
      L.gears.push(addItem('gear', g, { r: o.r, speed: o.speed, teeth: n }));
    }
    else if (o.t === 'bridge') {
      const span = o.x2 - o.x1, seg = span / o.n, pl = seg - 6, group = Body.nextGroup(true), planks = [];
      for (let i = 0; i < o.n; i++) planks.push(Bodies.rectangle(o.x1 + (i + 0.5) * seg, o.y, pl, 14, { density: 0.0016, friction: 0.6, restitution: 0.15, collisionFilter: { group } }));
      const it = addItem('bridge', planks, { dyn: true, x1: o.x1, x2: o.x2, y: o.y, pl });
      const link = opt => Composite.add(world, Constraint.create(Object.assign({ stiffness: 0.85, damping: 0.05 }, opt)));
      link({ pointA: { x: o.x1, y: o.y }, bodyB: planks[0], pointB: { x: -pl / 2, y: 0 } });
      for (let i = 0; i < o.n - 1; i++) link({ bodyA: planks[i], pointA: { x: pl / 2, y: 0 }, bodyB: planks[i + 1], pointB: { x: -pl / 2, y: 0 } });
      link({ bodyA: planks[o.n - 1], pointA: { x: pl / 2, y: 0 }, pointB: { x: o.x2, y: o.y } });
      it.planks = planks;
    }
    else if (o.t === 'hedge') {
      // Neliöksi leikattu pensas: pehmeä, ei juuri pomputa
      const base = o.y || GY;
      addItem('hedge', Bodies.rectangle(o.x, base - o.h / 2, o.w, o.h, { isStatic: true, friction: 0.9, restitution: 0.1, bounceCap: CONFIG.hedge.bounce }), { x: o.x, base, w: o.w, h: o.h });
    }
    else if (o.t === 'gnome') {
      // Puutarhatonttu: vartalo ja suippo hattu, pomputtaa kovaa
      const base = o.y || GY, st = { isStatic: true, friction: 0.4, restitution: CONFIG.gnome.restitution };
      addItem('gnome', [Bodies.rectangle(o.x, base - 29, 46, 58, Object.assign({ chamfer: { radius: 10 } }, st)),
                        Bodies.polygon(o.x, base - 75, 3, 26, Object.assign({ angle: -Math.PI / 6 }, st))], { x: o.x, base });
    }
    else if (o.t === 'tree') {
      // Omenapuu: runko ja pyöreä latva
      const base = o.y || GY, cy = base - o.trunk - o.r * 0.55, st = { isStatic: true, friction: 0.7, restitution: 0.1, bounceCap: CONFIG.hedge.bounce };
      addItem('tree', [Bodies.rectangle(o.x, base - o.trunk / 2, 26, o.trunk, st), Bodies.circle(o.x, cy, o.r, st)], { x: o.x, base, th: o.trunk, r: o.r, cy });
    }
    else if (o.t === 'sprinkler') {
      // Sadetin: ei törmäyskappaletta, vaan jaksottainen suihku, joka työntää banaania suuntaansa
      const SP = CONFIG.sprinkler, a = (o.dir === undefined ? -90 : o.dir) * Math.PI / 180, base = o.y || GY;
      const it = { kind: 'sprinkler', body: null, bodies: [], init: [], x: o.x, base, nx: o.x, ny: base - 26, ux: Math.cos(a), uy: Math.sin(a),
        power: o.power || SP.power, len: o.len || SP.len, width: SP.width, period: o.period || SP.period, on: o.on || SP.on, phase: o.phase || 0, active: false };
      L.items.push(it); L.sprinklers.push(it);
    }
    else if (o.t === 'cactus') {
      // Kaktus: runko ja kaksi haaraa, ei pomputa
      const w = 44, base = o.y || GY, t = w * 0.55, st = { isStatic: true, friction: 0.8, restitution: 0.1, bounceCap: 0.2 };
      const bodies = [Bodies.rectangle(o.x, base - o.h / 2, w, o.h, Object.assign({ chamfer: { radius: 18 } }, st))];
      for (const [d, f, lf] of CACT) {
        const ay = base - o.h * f, ax = o.x + d * w * 0.95;
        bodies.push(Bodies.rectangle((o.x + ax) / 2, ay, w * 0.95, t, st), Bodies.rectangle(ax, ay - o.h * lf / 2, t, o.h * lf + t, st));
      }
      addItem('cactus', bodies, { x: o.x, base, h: o.h, w });
    }
    else if (o.t === 'cloud') addItem('cloud', Bodies.rectangle(o.x, o.y, o.w, 50, { isStatic: true, chamfer: { radius: 22 }, friction: 0.3, restitution: CONFIG.cloud.restitution }), { x: o.x, y: o.y, w: o.w });
    else if (o.t === 'mover') {
      // Liikkuva lava: kulkee edestakaisin tasaisessa tahdissa (dx/dy = liikkeen laajuus, period = jakso sekunteina)
      L.movers.push(addItem('plank', Bodies.rectangle(o.x, o.y, o.w, o.h, { isStatic: true, friction: 0.6, restitution: 0.2 }),
        { w: o.w, h: o.h, bx: o.x, by: o.y, dx: o.dx || 0, dy: o.dy || 0, period: o.period || 3, phase: o.phase || 0, mover: true }));
    }
    else if (o.t === 'swing') {
      // Heiluri: kookospähkinä liaanin päässä, lähtee aina samasta kulmasta a0
      const bob = Bodies.circle(o.x + Math.sin(o.a0) * o.len, o.y + Math.cos(o.a0) * o.len, o.r, { density: 0.006, friction: 0.4, restitution: 0.5, frictionAir: 0 });
      addItem('swing', bob, { dyn: true, px: o.x, py: o.y, r: o.r });
      Composite.add(world, Constraint.create({ pointA: { x: o.x, y: o.y }, bodyB: bob, length: o.len, stiffness: 1, damping: 0 }));
    }
  }
  // Korit: jokainen kori läpäisee tason, kerroin riippuu korin koosta
  for (const k of def.buckets) {
    const d = CONFIG.bucket.sizes[k.size], y = k.y || GY;
    L.buckets.push(addItem('bucket', bucketBodies(k.x, y, d.top, d.bottom, d.height), { x: k.x, y, wt: d.top, wb: d.bottom, h: d.height, mult: d.mult, size: k.size, depth: d.depth || 8 }));
  }

  // Linko: pussi on oikea kappale, joka roikkuu kahdesta kuminauhasta haarukan kärjissä
  const SL = CONFIG.sling;
  S.pouch = Bodies.circle(SL.x, SL.y, SL.pouchRadius, {
    density: SL.pouchDensity, restitution: SL.pouchRestitution, friction: 0.7, frictionAir: SL.pouchAir,
    collisionFilter: { category: CAT.POUCH, mask: 0 },
  });
  S.bands = [-1, 1].map(d => Constraint.create({ pointA: { x: SL.x + d * SL.prongGap / 2, y: SL.y }, bodyB: S.pouch, length: 0, stiffness: SL.stiffness, damping: SL.damping }));
  Composite.add(world, [S.pouch, ...S.bands]);
  S.held = false; S.armed = false; S.pointerId = null;

  Events.on(engine, 'collisionStart', onCollisionStart);
}

/* Palauttaa liikkuvat palikat alkutilaan, jotta sama veto samalla ajoituksella antaa aina saman tuloksen */
function resetDynamics() {
  for (const it of L.items) {
    if (it.dyn) it.bodies.forEach((b, i) => { Body.setPosition(b, it.init[i]); Body.setAngle(b, it.init[i].a); Body.setVelocity(b, { x: 0, y: 0 }); Body.setAngularVelocity(b, 0); });
    if (it.kind === 'gear') Body.setAngle(it.body, it.init[0].a);
  }
}

/* =====================================================================
   4. PELITILA
   ===================================================================== */
const G = {
  world: 0, level: 0, phase: 'menu', // menu = aloitusruutu, wait = odottaa ensimmäistä tarttumista, play, won, card
  attempts: 1, total: 0, scores: [],
  banana: null, bstate: null,       // rolling = vierii rampilla, flying = lingottu
  rollT: 0, flyT: 0, stopT: 0, goalT: 0, inBucket: null, spawnT: 0, wonT: 0, time: 0, cycleT: 0,
  lastMult: 1, lastBase: 0, lastSpin: 1, lastSpins: 0,
  spins: 0, spinAcc: 0, lastAngle: 0, spinPulse: 0,     // täydet kierrokset samaan suuntaan lennon aikana
  flex: { curl: 0, vc: 0, wave: 0, vw: 0 },             // banaanin taipuma ja sen nopeudet
  trail: [], ghosts: [], particles: [], popups: [], lastScore: 0, shake: 0,
};

/* Banaanin arvo = tason arvo × kierroskerroin (×1.01 ensimmäisestä kierroksesta, ×1.02 toisesta jne.) */
function spinMult() { return 1 + CONFIG.banana.spinBonus * G.spins; }
function bananaValue() { return Math.round(levelValue() * spinMult()); }
function levelValue() { const P = CONFIG.score; return Math.max(P.min, P.start - P.step * (G.attempts - 1)); }

function loadLevel(i) {
  G.level = i; G.phase = 'wait'; G.attempts = 1; G.banana = null; G.bstate = null;
  G.trail = []; G.ghosts = []; G.particles = []; G.popups = []; G.spawnT = 0; G.time = 0; G.cycleT = 0;
  buildLevel(LEVELS[i]);
  rebuildBackground();
  $('card').hidden = true;
  setTip('Taso ' + (i + 1) + ' · ' + LEVELS[i].name + ' — tartu lingon pussiin aloittaaksesi. ' + LEVELS[i].hint, true);
  updateHud();
}

function spawnBanana() {
  resetDynamics();
  const b = makeBanana();
  G.banana = b; G.bstate = 'rolling'; G.rollT = 0; G.flyT = 0; G.stopT = 0; G.goalT = 0; G.inBucket = null; G.cycleT = 0; G.trail = [];
  G.spins = 0; G.spinAcc = 0; G.spinPulse = 0; G.flex.curl = G.flex.vc = G.flex.wave = G.flex.vw = 0;
  placeRolling();
  Composite.add(world, b);
}

/* Vierivän banaanin paikka ja asento: se etenee rampilla tasaisesti pyörien eikä pysähdy odottamaan */
function placeRolling() {
  const B = CONFIG.banana, b = G.banana, t = G.rollT;
  const ang = B.startAngle + B.rollSpin * t, top = CONFIG.ramp.y;
  const y = top - bananaLowest(ang), y2 = top - bananaLowest(ang + B.rollSpin * DT);
  Body.setPosition(b, { x: B.spawnX + B.rollSpeed * t, y });
  Body.setAngle(b, ang);
  Body.setVelocity(b, { x: B.rollSpeed / 60, y: (y2 - y) / DT / 60 });
  Body.setAngularVelocity(b, B.rollSpin / 60);
}

function onCollisionStart(ev) {
  const ban = G.banana; if (!ban) return;
  for (const p of ev.pairs) {
    const a = p.bodyA.parent, c = p.bodyB.parent;
    if (a !== ban && c !== ban) continue;
    const other = a === ban ? c : a;
    if (other === S.pouch) {
      if (G.bstate === 'rolling' && S.armed) {
        // Pussi osui: tästä eteenpäin banaani on vapaa, lötkö fysiikkakappale
        G.bstate = 'flying'; G.flyT = 0; S.hitTime = G.time;
        G.spins = 0; G.spinAcc = 0; G.lastAngle = ban.angle;
        flexKick(ban, other, p, CONFIG.banana.flop.slingBoost);
        burst(ban.position.x, ban.position.y, 7, ['#fff3d0', '#ffd92e'], 160);
        setTip('', false);
      }
      continue;
    }
    if (G.bstate !== 'flying') continue;
    flexKick(ban, other, p, 1);
    // Selkäpompun pieni välähdys (vain piirtotehoste)
    if (p.isBackHit && ban.speed > 4) { const q = p.collision.supports[0]; burst(q.x, q.y, 4, ['#fff3d0', '#ffd92e'], 130); }
  }
}

function disarm() { S.armed = false; if (S.pouch) S.pouch.collisionFilter.mask = 0; }

function failBanana(text, mode) {
  const b = G.banana; if (!b) return;
  G.ghosts.push({ x: b.position.x, y: b.position.y, a: b.angle, vx: b.velocity.x * 60, vy: b.velocity.y * 60, va: b.angularVelocity * 60, life: 0.7, max: 0.7, mode, curl: G.flex.curl, wave: G.flex.wave });
  popup(text, b.position.x, b.position.y - 46, '#fff3d0');
  Composite.remove(world, b);
  G.banana = null; G.bstate = null; disarm();
  G.attempts++; G.spawnT = CONFIG.banana.respawnDelay;
  updateHud();
}

function win(k) {
  G.phase = 'won'; G.wonT = CONFIG.score.showTime; disarm();
  G.lastBase = levelValue(); G.lastMult = k.mult; G.lastSpins = G.spins; G.lastSpin = spinMult();
  G.lastScore = Math.round(G.lastBase * G.lastSpin * k.mult); G.total += G.lastScore; G.scores[G.level] = G.lastScore;
  const best = bestOf(curWorld());
  G.newBest = G.lastScore > (best[G.level] || 0);
  if (G.newBest) { best[G.level] = G.lastScore; saveStore(); }
  burst(k.x, k.y - k.h, reducedMotion ? 14 : 40 + 20 * k.mult, ['#ffd92e', '#e8493c', '#4fae45', '#fff3d0', '#35b6d9'], 520, true);
  popup('×' + k.mult + (k.mult >= 10 ? ' USKOMATONTA!' : k.mult >= 3 ? ' HUIPPUA!' : k.mult === 2 ? ' HYVÄ!' : ' KORISSA!'), k.x, k.y - k.h - 90, '#ffd92e', 64);
  G.shake = 0.35;
  updateHud();
}

/* Yksi kiinteä fysiikka-askel */
function step() {
  G.time += DT;
  G.cycleT += DT;
  // Rattaat ja lavat liikkuvat kellon mukaan; edellinen asento talteen, jotta ne myös tönäisevät banaania
  for (const g of L.gears) { const a = g.body.angle; Body.setAngle(g.body, a + g.speed * DT); g.body.anglePrev = a; }
  for (const m of L.movers) {
    const b = m.body, k = Math.sin(G.cycleT * 2 * Math.PI / m.period + m.phase), ox = b.position.x, oy = b.position.y;
    Body.setPosition(b, { x: m.bx + m.dx * k, y: m.by + m.dy * k }); b.positionPrev.x = ox; b.positionPrev.y = oy;
  }
  if (S.held) { Body.setPosition(S.pouch, S.target); Body.setVelocity(S.pouch, { x: 0, y: 0 }); }
  if (G.banana && G.bstate === 'rolling') { G.rollT += DT; placeRolling(); }
  if (G.banana && G.bstate === 'flying') stepFlex(G.banana);
  // Sadettimet suihkuavat kellon mukaan ja työntävät suihkussa olevaa banaania
  for (const sp of L.sprinklers) {
    sp.active = ((G.cycleT + sp.phase) % sp.period) < sp.on;
    const b = G.banana;
    if (!sp.active || !b || G.bstate !== 'flying') continue;
    const dx = b.position.x - sp.nx, dy = b.position.y - sp.ny, al = dx * sp.ux + dy * sp.uy, pe = Math.abs(dx * sp.uy - dy * sp.ux);
    if (al < -10 || al > sp.len || pe > sp.width / 2 + al * 0.18) continue;
    const f = b.mass * sp.power * 0.001 * (1 - 0.5 * clamp(al / sp.len, 0, 1));
    Body.applyForce(b, b.position, { x: sp.ux * f, y: sp.uy * f });
  }
  if (G.spinPulse > 0) G.spinPulse -= DT;

  Engine.update(engine, 1000 * DT);

  if (S.held) { Body.setPosition(S.pouch, S.target); Body.setVelocity(S.pouch, { x: 0, y: 0 }); }

  // Pussi on "terävä" vain yhden heilahduksen ajan laukaisun jälkeen
  if (S.armed) {
    const SL = CONFIG.sling, sp = S.pouch.speed, q = S.pouch.position;
    S.armT += DT; S.peak = Math.max(S.peak, sp);
    // Onko pussi jo heilahtanut lepoasennon ohi ja hidastumassa?
    const passed = (q.x - SL.x) * (S.target.x - SL.x) + (q.y - SL.y) * (S.target.y - SL.y) < 0;
    const spent = passed && S.peak > SL.armSpeed && sp < S.peak * 0.75;
    if ((G.bstate !== 'flying' && spent) || S.armT > 1.2 || (G.bstate === 'flying' && G.time - S.hitTime > 0.35)) disarm();
  }

  if (G.phase === 'play') {
    const b = G.banana;
    if (!b) { G.spawnT -= DT; if (G.spawnT <= 0) spawnBanana(); }
    else if (G.bstate === 'rolling') {
      if (b.position.x > CONFIG.banana.passX) failBanana('Ohi meni!', 'fall');
    } else checkFlight(b);
  } else if (G.phase === 'won') {
    G.wonT -= DT; if (G.wonT <= 0) showCard();
  }
  for (const it of L.items) if (it.kind === 'tramp' && it.squash > 0) it.squash = Math.max(0, it.squash - DT * 4);
}

function insideBucket(p, k) { return Math.abs(p.x - k.x) < k.wt / 2 - 10 && p.y > k.y - k.h + k.depth && p.y < k.y + 4; }

function checkFlight(b) {
  const B = CONFIG.banana, p = b.position;
  G.flyT += DT;
  // Täydet kierrokset samaan suuntaan kasvattavat banaanin arvoa. Suunnan vaihtuessa keskeneräinen kierros nollautuu, ansaittu säilyy.
  const dA = b.angle - G.lastAngle; G.lastAngle = b.angle;
  if (dA * G.spinAcc < 0) G.spinAcc = 0;
  G.spinAcc += dA;
  if (Math.abs(G.spinAcc) >= 2 * Math.PI) { G.spinAcc -= Math.sign(G.spinAcc) * 2 * Math.PI; G.spins++; G.spinPulse = 0.35; }
  if (Math.round(G.flyT / DT) % 2 === 0) { G.trail.push({ x: p.x, y: p.y }); if (G.trail.length > 70) G.trail.shift(); }
  // Trampoliinin painuma (pelkkä piirtotehoste)
  for (const it of L.items) if (it.kind === 'tramp' && Math.abs(p.x - it.x) < it.w / 2 + 20 && p.y > it.y - 34 && p.y < it.y + 6 && b.velocity.y < -2) it.squash = 1;

  if (p.y > H + 120 || p.x < -220 || p.x > W + 220) return failBanana('Karkasi!', 'fade');
  for (const [x1, x2] of L.def.water) if (p.x > x1 && p.x < x2 && p.y > GY + 12) { const T = TH(); if (T.splash) splash(p.x, T.splash); return failBanana(T.fail, T.splash ? 'sink' : 'fall'); }

  let hit = null;
  for (const k of L.buckets) if (insideBucket(p, k)) { hit = k; break; }
  if (hit) {
    b.frictionAir = CONFIG.bucket.damping;
    if (hit !== G.inBucket) { G.inBucket = hit; G.goalT = 0; }
    G.goalT += DT;
    if (G.goalT >= CONFIG.bucket.winTime) return win(hit);
    return;
  }
  G.inBucket = null; G.goalT = 0; b.frictionAir = CONFIG.physics.airFriction;

  if (b.speed < B.stopSpeed && Math.abs(b.angularVelocity) < B.stopSpin) { G.stopT += DT; if (G.stopT > B.stopTime) return failBanana('Jäi matkalle', 'fade'); }
  else G.stopT = 0;
  if (G.flyT > B.timeLimit) failBanana('Aika loppui', 'fade');
}

/* =====================================================================
   5. SYÖTTEEN KÄSITTELY – vain lingon pussiin voi tarttua, banaaniin ei koskaan
   ===================================================================== */
function clampTarget(x, y) {
  const SL = CONFIG.sling, dx = x - SL.x, dy = y - SL.y, d = Math.hypot(dx, dy);
  if (d <= SL.maxPull) return { x, y };
  return { x: SL.x + dx / d * SL.maxPull, y: SL.y + dy / d * SL.maxPull };
}
function grab(x, y) {
  if (G.phase !== 'wait' && G.phase !== 'play') return false;
  const p = S.pouch.position;
  if (Math.hypot(x - p.x, y - p.y) > CONFIG.sling.grabRadius) return false;
  S.held = true; disarm(); S.target = clampTarget(p.x, p.y);
  if (G.phase === 'wait') { G.phase = 'play'; spawnBanana(); }
  return true;
}
function dragTo(x, y) { if (S.held) S.target = clampTarget(x, y); }
function release() {
  if (!S.held) return;
  S.held = false;
  Body.setPosition(S.pouch, S.target); Body.setVelocity(S.pouch, { x: 0, y: 0 });
  const SL = CONFIG.sling, pull = Math.hypot(S.target.x - SL.x, S.target.y - SL.y);
  if (pull >= SL.minPull && G.banana && G.bstate === 'rolling') {
    S.armed = true; S.peak = 0; S.armT = 0;
    S.pouch.collisionFilter.mask = CAT.BANANA;
  }
}

const canvas = $('c'), ctx = canvas.getContext('2d');
const V = { s: 1, ox: 0, oy: 0, dpr: 1, cw: 0, ch: 0 };   // näkymän skaalaus
function toWorld(e) { const r = canvas.getBoundingClientRect(); return { x: (e.clientX - r.left - V.ox) / V.s, y: (e.clientY - r.top - V.oy) / V.s }; }
canvas.addEventListener('pointerdown', e => {
  const p = toWorld(e);
  if (grab(p.x, p.y)) { S.pointerId = e.pointerId; try { canvas.setPointerCapture(e.pointerId); } catch (err) {} canvas.classList.add('pull'); e.preventDefault(); }
});
canvas.addEventListener('pointermove', e => { if (S.held && e.pointerId === S.pointerId) { const p = toWorld(e); dragTo(p.x, p.y); e.preventDefault(); } });
function endPointer(e) { if (S.held && e.pointerId === S.pointerId) { release(); canvas.classList.remove('pull'); } }
canvas.addEventListener('pointerup', endPointer);
canvas.addEventListener('pointercancel', endPointer);
canvas.addEventListener('contextmenu', e => e.preventDefault());

function stat(dl, k, v) { const dt = document.createElement('dt'); dt.textContent = k; const dd = document.createElement('dd'); dd.textContent = v; dl.appendChild(dt); dl.appendChild(dd); }
function showCard() {

/* Maailman loppuyhteenveto: avaa seuraavan maailman ja kysyy nimen, jos tulos yltää ennätyslistalle */
function showFinal() {
  const w = curWorld(), next = WORLDS[G.world + 1], N = CONFIG.score.topN;
  const firstClear = !store.done[w.theme];
  store.done[w.theme] = true; saveStore();
  const list = shownList(w), qualifies = list.length < N || G.total > list[list.length - 1].s;
  $('cTitle').textContent = w.name + ' läpäisty!';
  $('cStars').hidden = true;
  const dl = $('cStats'); dl.textContent = '';
  LEVELS.forEach((lv, i) => stat(dl, (i + 1) + '. ' + lv.name, G.scores[i] || 0));
  stat(dl, 'Kokonaispisteet', G.total);
  const notes = [];
  if (firstClear && next) notes.push('Uusi maailma avattu: ' + next.name + '!');
  if (!qualifies) notes.push('Listalle pääsee yli ' + list[list.length - 1].s + ' pisteellä.');

}
function saveScore() {
  const w = curWorld(), name = ($('nameInput').value || '').trim().slice(0, 12);
  if (name) store.name = name;
  const entry = { n: name || 'Nimetön', s: G.total, t: Date.now() };
  // Tulos tallentuu aina myös tälle laitteelle
  store.scores[w.theme] = topList(w).concat([entry]).sort((a, b) => b.s - a.s || a.t - b.t).slice(0, CONFIG.score.topN);
  saveStore();
  $('card').hidden = true;
  if (!onlineOn()) return showScores(G.world, entry);
  const wi = G.world;
  ONLINE.saving = true; ONLINE.saveFailed = false;
  showScores(wi, entry);
  apiFetch('scores', 'POST', { world: w.theme, name: entry.n, score: entry.s })
    .then(() => loadOnline(w), () => { ONLINE.saveFailed = true; })
    .then(() => { ONLINE.saving = false; if (!$('scores').hidden && G.scoreTab === wi) showScores(wi, entry); });
}

/* Ennätyslista: kymmenen parasta kokonaistulosta maailmaa kohti. mark = juuri tallennettu rivi korostetaan. */
function showScores(wi, mark) {
  $('menu').hidden = true; $('scores').hidden = false; G.scoreTab = wi;

  const stt = ONLINE.state[W0.theme];

    : ONLINE.saving ? 'Tallennetaan tulosta yhteiselle listalle…'
    : ONLINE.saveFailed ? 'Tulosta ei saatu yhteiselle listalle. Se tallentui tälle laitteelle.'
    : stt === 'loading' ? 'Ladataan yhteistä listaa…'
    : stt === 'ok' ? 'Yhteinen lista: kaikkien pelaajien parhaat tulokset.'

    b.textContent = w.name; b.addEventListener('click', () => { ONLINE.saveFailed = false; showScores(i, mark); });

  }
}

/* Tehosteet (vain piirtoa, eivät vaikuta fysiikkaan) */
function burst(x, y, n, colors, speed, confetti) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, v = speed * (0.3 + Math.random() * 0.7);
    G.particles.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - (confetti ? 260 : 0), life: confetti ? 1.6 : 0.45, max: confetti ? 1.6 : 0.45,
      c: colors[i % colors.length], s: confetti ? 7 + Math.random() * 7 : 5 + Math.random() * 5, r: Math.random() * 6, vr: (Math.random() - 0.5) * 14, confetti: !!confetti });
  }
}
function splash(x, cols) { for (let i = 0; i < 16; i++) G.particles.push({ x: x + (Math.random() - 0.5) * 30, y: GY + 14, vx: (Math.random() - 0.5) * 260, vy: -180 - Math.random() * 260, life: 0.7, max: 0.7, c: cols[i % 2], s: 6 + Math.random() * 6, r: 0, vr: 0 }); }
function popup(text, x, y, color, size) { G.popups.push({ text, x: clamp(x, 110, W - 110), y: clamp(y, 110, GY - 20), life: 1.3, max: 1.3, color, size: size || 38 }); }

function updateEffects(dt) {
  for (const p of G.particles) { p.life -= dt; p.vy += 900 * dt; p.x += p.vx * dt; p.y += p.vy * dt; p.r += p.vr * dt; if (p.confetti) p.vx *= 0.985; }
  G.particles = G.particles.filter(p => p.life > 0);
  for (const g of G.ghosts) {
    g.life -= dt;
    if (g.mode === 'fall') { g.vy += 1500 * dt; g.x += g.vx * dt; g.y += g.vy * dt; g.a += g.va * dt; }
    else if (g.mode === 'sink') { g.y += 70 * dt; g.a += 1.2 * dt; }
  }
  G.ghosts = G.ghosts.filter(g => g.life > 0);
  for (const p of G.popups) { p.life -= dt; p.y -= 34 * dt; }
  G.popups = G.popups.filter(p => p.life > 0);
  if (G.shake > 0) G.shake = Math.max(0, G.shake - dt);
}

/* =====================================================================
   6. PIIRTO
   ===================================================================== */
function inkStroke(c, lw) { c.lineWidth = lw || 5; c.strokeStyle = INK; c.lineJoin = 'round'; c.lineCap = 'round'; c.stroke(); }
function pathPoly(c, pts) { c.beginPath(); c.moveTo(pts[0].x, pts[0].y); for (let i = 1; i < pts.length; i++) c.lineTo(pts[i].x, pts[i].y); c.closePath(); }
function rrect(c, x, y, w, h, r) { c.beginPath(); c.moveTo(x + r, y); c.lineTo(x + w - r, y); c.quadraticCurveTo(x + w, y, x + w, y + r); c.lineTo(x + w, y + h - r); c.quadraticCurveTo(x + w, y + h, x + w - r, y + h); c.lineTo(x + r, y + h); c.quadraticCurveTo(x, y + h, x, y + h - r); c.lineTo(x, y + r); c.quadraticCurveTo(x, y, x + r, y); c.closePath(); }
/* Pilvimäinen möykky: ympyröiden yhdiste yhtenäisellä ääriviivalla */
function blob(c, circles, fill, lw) {
  c.lineWidth = (lw || 5) * 2; c.strokeStyle = INK;
  for (const [x, y, r] of circles) { c.beginPath(); c.arc(x, y, r, 0, 7); c.stroke(); }
  c.fillStyle = fill;
  for (const [x, y, r] of circles) { c.beginPath(); c.arc(x, y, r, 0, 7); c.fill(); }
}
function hills(c, base, amp, f, ph, fill) {
  c.beginPath(); c.moveTo(-1400, GY + 60);
  for (let x = -1400; x <= W + 1400; x += 30) c.lineTo(x, base - amp * (0.5 + 0.5 * Math.sin(x * f + ph)) - amp * 0.3 * Math.sin(x * f * 2.7 + ph * 2));
  c.lineTo(W + 1400, GY + 60); c.closePath(); c.fillStyle = fill; c.fill(); inkStroke(c, 4);
}
function palm(c, x, y, h, lean, s) {
  const tx = x + lean, ty = y - h;
  c.beginPath(); c.moveTo(x, y); c.quadraticCurveTo(x + lean * 0.2, y - h * 0.6, tx, ty);
  c.lineWidth = 22 * s; c.strokeStyle = INK; c.lineCap = 'round'; c.stroke();
  c.lineWidth = 14 * s; c.strokeStyle = '#9a6a3a'; c.stroke();
  for (let i = 0; i < 7; i++) {
    const a = -Math.PI + i * Math.PI / 6 + 0.02, len = 95 * s * (0.8 + 0.25 * Math.sin(i * 2.1));
    const ex = tx + Math.cos(a) * len, ey = ty + Math.sin(a) * len * 0.75 + 34 * s;
    const mx = tx + Math.cos(a) * len * 0.5, my = ty + Math.sin(a) * len * 0.6 - 8 * s;
    const nx = -Math.sin(a) * 20 * s, ny = Math.cos(a) * 20 * s;
    c.beginPath(); c.moveTo(tx, ty); c.quadraticCurveTo(mx + nx, my + ny, ex, ey); c.quadraticCurveTo(mx - nx, my - ny, tx, ty); c.closePath();
    c.fillStyle = i % 2 ? '#3f9b3a' : '#57b548'; c.fill(); inkStroke(c, 4);
  }
}
function vine(c, x, y, len, sway) {
  c.beginPath(); c.moveTo(x, y); c.bezierCurveTo(x + sway, y + len * 0.35, x - sway, y + len * 0.7, x + sway * 0.4, y + len);
  c.lineWidth = 9; c.strokeStyle = INK; c.lineCap = 'round'; c.stroke(); c.lineWidth = 4; c.strokeStyle = '#4b8f2f'; c.stroke();
  for (let i = 1; i <= 3; i++) { const t = i / 4, lx = x + Math.sin(t * 5) * sway * 0.6, ly = y + len * t; c.beginPath(); c.ellipse(lx + 9, ly, 11, 5, 0.5, 0, 7); c.fillStyle = '#57b548'; c.fill(); inkStroke(c, 3); }
}

/* Teemat: jokaisella maailmalla oma maa, vaara-alue, kivien värit ja tausta */
const THEMES = {
  jungle:   { soil: '#9a6233', band: '#b9793f', top: '#6cc04a', tuft: '#4fae45', haz: 'water', hazA: '#2aa3cc', hazB: '#4cc3e6', rock: ['#929c98', '#bcc5c0', '#6f7a76'], fail: 'Molskis!', splash: ['#bfeaf5', '#35b6d9'] },
  desert:   { soil: '#c98a45', band: '#dba25a', top: '#f0cd7c', tuft: '#d9a94e', haz: 'sand',  hazA: '#a8733a', hazB: '#bf8a4c', rock: ['#d08a56', '#e9b382', '#a8653a'], fail: 'Upposi hiekkaan!', splash: ['#f0cd7c', '#c98a45'] },
  sea:      { soil: '#e0bf7c', band: '#ecd198', top: '#f6e3ad', tuft: '#5fb866', haz: 'water', hazA: '#1878b4', hazB: '#35a0d8', rock: ['#e9806e', '#f5ab9c', '#bf5a4c'], fail: 'Molskis!', splash: ['#d4f0fb', '#35a0d8'] },
  mountain: { soil: '#7b8799', band: '#909cae', top: '#f6fbff', tuft: '#cfe3f2', haz: 'chasm', hazA: '#1b2030', hazB: '#2b3350', rock: ['#8b97a8', '#eef6fb', '#5f6b7c'], fail: 'Putosi rotkoon!', splash: null },
  cloud:    { soil: '#ffffff', band: '#dfe9ff', top: '#ffffff', tuft: null,      haz: 'sky',   hazA: null,      hazB: null,      rock: ['#ffd95e', '#fff3b0', '#e0a92e'], fail: 'Putosi pilvestä!', splash: null },
  garden:   { soil: '#7a5230', band: '#8f6238', top: '#7cc74e', tuft: '#4fae45', haz: 'water', hazA: '#2f8fb0', hazB: '#5cc0d8', rock: ['#a8a29a', '#d3cec5', '#7d776f'], fail: 'Molskis lampeen!', splash: ['#d4f0fb', '#5cc0d8'] },
};
const TH = () => THEMES[curWorld().theme];

/* Kaktus: sama piirros taustalle ja pelikappaleelle (haarat: suunta, korkeus rungosta, pituus) */
const CACT = [[-1, 0.45, 0.28], [1, 0.62, 0.22]];
function drawCactus(c, x, base, h, w, lw) {
  const col = '#4f9d4a', t = w * 0.55; c.lineCap = 'round'; c.lineJoin = 'round';
  for (const [d, f, lf] of CACT) {
    const ay = base - h * f;
    c.beginPath(); c.moveTo(x, ay); c.lineTo(x + d * w * 0.95, ay); c.lineTo(x + d * w * 0.95, ay - h * lf);
    c.lineWidth = t + lw * 2; c.strokeStyle = INK; c.stroke(); c.lineWidth = t; c.strokeStyle = col; c.stroke();
  }
  c.beginPath(); c.moveTo(x - w / 2, base); c.lineTo(x - w / 2, base - h + w / 2); c.arc(x, base - h + w / 2, w / 2, Math.PI, 0); c.lineTo(x + w / 2, base); c.closePath();
  c.fillStyle = col; c.fill(); inkStroke(c, lw);
  c.lineWidth = lw * 0.6; c.strokeStyle = '#3b7d39';
  for (const d of [-0.17, 0.17]) { c.beginPath(); c.moveTo(x + d * w, base - 8); c.lineTo(x + d * w, base - h + w * 0.55); c.stroke(); }
}
function mountain(c, x, base, w, h, fill) {
  const p = [{ x: x - w / 2, y: base }, { x: x - w * 0.12, y: base - h * 0.8 }, { x, y: base - h }, { x: x + w * 0.16, y: base - h * 0.72 }, { x: x + w / 2, y: base }];
  pathPoly(c, p); c.fillStyle = fill; c.fill(); inkStroke(c, 5);
  pathPoly(c, [p[1], p[2], p[3], { x: x + w * 0.07, y: base - h * 0.62 }, { x: x + w * 0.01, y: base - h * 0.7 }, { x: x - w * 0.05, y: base - h * 0.6 }]);
  c.fillStyle = '#f6fbff'; c.fill(); inkStroke(c, 4);
}
function pine(c, x, y, s) {
  c.beginPath(); c.rect(x - 5 * s, y - 22 * s, 10 * s, 22 * s); c.fillStyle = '#7a4a26'; c.fill(); inkStroke(c, 3);
  for (let i = 0; i < 3; i++) {
    const w = (44 - i * 10) * s, yy = y - 18 * s - i * 30 * s;
    pathPoly(c, [{ x: x - w, y: yy }, { x, y: yy - 52 * s }, { x: x + w, y: yy }]); c.fillStyle = i === 2 ? '#f6fbff' : '#2f7a55'; c.fill(); inkStroke(c, 4);
  }
}
/* Puutarhatonttu: sama piirros taustalle (pienempänä) ja pelikappaleelle */
function drawGnome(c, x, base, k) {

function drawHedge(c, x, base, w, h, lw) {
  rrect(c, x - w / 2, base - h, w, h, Math.min(9, w / 5)); c.fillStyle = '#3f9b3a'; c.fill(); inkStroke(c, lw);

}

const bg = document.createElement('canvas');

/* Banaani piirretään taipuneen keskiviivansa mukaan: kypsän keltainen, kiiltävä ja (lennossa) hieman hohtava */
function drawBanana(c, x, y, ang, alpha, curl, wave, glow, t) {
  c.save(); c.globalAlpha = alpha; c.translate(x, y);
  if (glow) {
    const r = 92 + (reducedMotion ? 0 : Math.sin(t * 3.2) * 6), g = c.createRadialGradient(0, 0, 8, 0, 0, r);
    g.addColorStop(0, 'rgba(255,238,130,.55)'); g.addColorStop(0.55, 'rgba(255,224,80,.22)'); g.addColorStop(1, 'rgba(255,224,80,0)');
    c.fillStyle = g; c.beginPath(); c.arc(0, 0, r, 0, 7); c.fill();
  }
  c.rotate(ang);
  const N = 18, ext = BAN.Lh + 7.5, sArr = [];
  for (let i = 0; i <= N; i++) sArr.push(-ext + 2 * ext * i / N);
  const pts = flexLocal(curl || 0, wave || 0, sArr);
  const wd = i => 4.5 + 10.5 * Math.pow(Math.cos((i / N * 2 - 1) * Math.PI / 2), 0.55);          // paksuus keskiviivasta
  const off = (k, i0, i1) => { const o = []; for (let i = i0; i <= i1; i++) { const p = pts[i], w = wd(i) * k; o.push({ x: p.x + p.nx * w, y: p.y + p.ny * w }); } return o; };
  const line = (o, lw, col) => { c.beginPath(); c.moveTo(o[0].x, o[0].y); for (const q of o) c.lineTo(q.x, q.y); c.lineWidth = lw; c.strokeStyle = col; c.lineCap = 'round'; c.lineJoin = 'round'; c.stroke(); };
  const outline = off(1, 0, N).concat(off(-1, 0, N).reverse());
  // Kanta
  const a = pts[0], a2 = pts[1], dl = Math.hypot(a.x - a2.x, a.y - a2.y) || 1, stem = [a, { x: a.x + (a.x - a2.x) / dl * 10, y: a.y + (a.y - a2.y) / dl * 10 }];
  line(stem, 12, INK); line(stem, 6, '#8a8f2e');
  pathPoly(c, outline); c.fillStyle = '#ffd426'; c.fill();
  line(off(-0.5, 2, N - 2), 6, '#f2ab1c');                 // vatsapuolen kypsä varjo
  line(off(0.22, 2, N - 2), 7, '#ffe76a');                 // vaalea vyö
  line(off(0.6, 3, 10), 3.4, 'rgba(255,255,255,.92)');     // kiilto selässä
  pathPoly(c, outline); inkStroke(c, 4.5);
  c.fillStyle = 'rgba(160,96,10,.75)';                     // kypsyyspisamat
  for (const [i, k] of [[6, -0.15], [11, 0.3], [13, -0.3]]) { const p = pts[i], w = wd(i) * k; c.beginPath(); c.arc(p.x + p.nx * w, p.y + p.ny * w, 1.9, 0, 7); c.fill(); }
  const e = pts[N]; c.beginPath(); c.arc(e.x, e.y, 4.4, 0, 7); c.fillStyle = '#4a2f16'; c.fill(); inkStroke(c, 3);
  c.restore();
}

    const s = it.s; c.save(); c.translate(b.position.x, b.position.y); c.rotate(b.angle);
    c.fillStyle = '#cf9048'; c.fillRect(-s / 2, -s / 2, s, s); c.beginPath(); c.rect(-s / 2, -s / 2, s, s); inkStroke(c, 5);
    c.lineWidth = 5; c.strokeStyle = '#8a5326'; c.strokeRect(-s / 2 + 9, -s / 2 + 9, s - 18, s - 18);
    c.beginPath(); c.moveTo(-s / 2 + 11, s / 2 - 11); c.lineTo(s / 2 - 11, -s / 2 + 11); c.stroke(); c.restore();
  } else if (it.kind === 'barrel') {
    c.save(); c.translate(b.position.x, b.position.y); c.rotate(b.angle);
    c.beginPath(); c.moveTo(-22, -38); c.lineTo(22, -38); c.quadraticCurveTo(36, 0, 22, 38); c.lineTo(-22, 38); c.quadraticCurveTo(-36, 0, -22, -38); c.closePath();
    c.fillStyle = '#b5682f'; c.fill(); inkStroke(c, 5);
    c.lineWidth = 3; c.strokeStyle = '#8a4b20'; for (const xx of [-9, 9]) { c.beginPath(); c.moveTo(xx, -36); c.quadraticCurveTo(xx * 1.5, 0, xx, 36); c.stroke(); }
    for (const yy of [-20, 20]) { c.beginPath(); c.moveTo(-28, yy); c.lineTo(28, yy); c.lineWidth = 10; c.strokeStyle = INK; c.stroke(); c.lineWidth = 5; c.strokeStyle = '#8b97a3'; c.stroke(); }
    c.restore();
  } else if (it.kind === 'rock') {
    const R = TH().rock;   // kiven värit teeman mukaan
    pathPoly(c, b.vertices); c.fillStyle = R[0]; c.fill(); inkStroke(c, 5);
    const p = b.position, r = b.circleRadius || 40;
    c.beginPath(); c.moveTo(p.x - r * 0.45, p.y - r * 0.35); c.lineTo(p.x - r * 0.1, p.y - r * 0.55); c.lineTo(p.x + r * 0.2, p.y - r * 0.4); c.lineWidth = 5; c.strokeStyle = R[1]; c.stroke();
    c.beginPath(); c.moveTo(p.x + r * 0.1, p.y + r * 0.1); c.lineTo(p.x + r * 0.35, p.y + r * 0.3); c.lineWidth = 4; c.strokeStyle = R[2]; c.stroke();
  } else if (it.kind === 'plank') {
    pathPoly(c, b.vertices); c.fillStyle = it.ice ? '#bfe9fb' : it.mover ? '#e2a23f' : '#b8743a'; c.fill(); inkStroke(c, 5);
    if (it.mover) for (const d of [-1, 1]) { c.beginPath(); c.arc(b.position.x + d * (it.w / 2 - 14), b.position.y, 4, 0, 7); c.fillStyle = INK; c.fill(); }
    c.save(); c.translate(b.position.x, b.position.y); c.rotate(b.angle); c.lineWidth = 3; c.strokeStyle = it.ice ? '#ffffff' : '#8a5326';
    if (it.w >= it.h) { c.beginPath(); c.moveTo(-it.w / 2 + 12, 0); c.lineTo(it.w / 2 - 12, 0); c.stroke(); }
    else { c.beginPath(); c.moveTo(0, -it.h / 2 + 12); c.lineTo(0, it.h / 2 - 12); c.stroke(); }
    c.restore();
  } else if (it.kind === 'tramp') {
    const x = it.x, y = it.y, w = it.w, sq = it.squash * 9;
    c.lineWidth = 9; c.strokeStyle = INK; c.lineCap = 'round';
    for (const d of [-1, 1]) { c.beginPath(); c.moveTo(x + d * w * 0.36, y + 12); c.lineTo(x + d * w * 0.44, y + 62); c.stroke(); }
    c.lineWidth = 4; c.strokeStyle = '#8b97a3'; for (const d of [-1, 1]) { c.beginPath(); c.moveTo(x + d * w * 0.36, y + 12); c.lineTo(x + d * w * 0.44, y + 62); c.stroke(); }
    rrect(c, x - w / 2, y, w, 18, 9); c.fillStyle = '#2f80d8'; c.fill(); inkStroke(c, 5);
    c.beginPath(); c.moveTo(x - w / 2 + 14, y + 6); c.quadraticCurveTo(x, y + 6 + sq * 2, x + w / 2 - 14, y + 6); c.lineWidth = 7; c.strokeStyle = '#27303f'; c.stroke();
  } else if (it.kind === 'bridge') {
    for (const xx of [it.x1, it.x2]) { rrect(c, xx - 9, it.y - 58, 18, 90, 6); c.fillStyle = '#8a5326'; c.fill(); inkStroke(c, 5); }
    const pts = [{ x: it.x1, y: it.y - 44 }].concat(it.planks.map(p => ({ x: p.position.x, y: p.position.y - 30 })), [{ x: it.x2, y: it.y - 44 }]);
    c.beginPath(); c.moveTo(pts[0].x, pts[0].y); for (const p of pts) c.lineTo(p.x, p.y);
    c.lineWidth = 8; c.strokeStyle = INK; c.lineJoin = 'round'; c.stroke(); c.lineWidth = 3.5; c.strokeStyle = '#d9b06a'; c.stroke();
    for (const p of it.planks) {
      c.beginPath(); c.moveTo(p.position.x, p.position.y - 30); c.lineTo(p.position.x, p.position.y); c.lineWidth = 3; c.strokeStyle = INK; c.stroke();
      pathPoly(c, p.vertices); c.fillStyle = '#c98a45'; c.fill(); inkStroke(c, 4.5);
    }
  } else if (it.kind === 'gear') {
    const r = it.r; c.save(); c.translate(b.position.x, b.position.y); c.rotate(b.angle);
    for (let k = 0; k < it.teeth; k++) { c.save(); c.rotate(k * Math.PI * 2 / it.teeth); c.beginPath(); c.rect(r * 0.88 - r * 0.17, -r * 0.15, r * 0.34, r * 0.3); c.fillStyle = '#8d99a6'; c.fill(); inkStroke(c, 5); c.restore(); }
    c.beginPath(); c.arc(0, 0, r * 0.8, 0, 7); c.fillStyle = '#8d99a6'; c.fill(); inkStroke(c, 5);
    c.beginPath(); c.arc(0, 0, r * 0.52, 0, 7); c.fillStyle = '#6c7783'; c.fill(); inkStroke(c, 4);
    for (let k = 0; k < 4; k++) { c.beginPath(); c.arc(Math.cos(k * Math.PI / 2) * r * 0.32, Math.sin(k * Math.PI / 2) * r * 0.32, r * 0.07, 0, 7); c.fillStyle = INK; c.fill(); }
    c.beginPath(); c.arc(0, 0, r * 0.13, 0, 7); c.fillStyle = '#d9b06a'; c.fill(); inkStroke(c, 4);
    c.restore();
  } else if (it.kind === 'swing') {
    // Heiluri: viidakossa kookospähkinä, muissa maailmoissa teeman värinen paino
    const p = b.position, tint = BOB[curWorld().theme]; c.lineCap = 'round';
    c.beginPath(); c.moveTo(it.px, -400); c.lineTo(it.px, it.py); c.lineWidth = 12; c.strokeStyle = INK; c.stroke(); c.lineWidth = 6; c.strokeStyle = tint ? '#d9b06a' : '#4b8f2f'; c.stroke();
    c.beginPath(); c.moveTo(it.px, it.py); c.lineTo(p.x, p.y); c.lineWidth = 9; c.strokeStyle = INK; c.stroke(); c.lineWidth = 4; c.strokeStyle = '#d9b06a'; c.stroke();
    c.beginPath(); c.arc(it.px, it.py, 10, 0, 7); c.fillStyle = '#8a5326'; c.fill(); inkStroke(c, 4);
    c.save(); c.translate(p.x, p.y); c.rotate(b.angle);
    c.beginPath(); c.arc(0, 0, it.r, 0, 7); c.fillStyle = tint || '#7a4a26'; c.fill(); inkStroke(c, 5);
    c.beginPath(); c.arc(-it.r * 0.25, -it.r * 0.3, it.r * 0.45, 3.4, 4.9); c.lineWidth = 4; c.strokeStyle = tint ? 'rgba(255,255,255,.7)' : '#a06a3c'; c.stroke();
    if (!tint) for (const [ex, ey] of [[-0.25, 0.1], [0.25, 0.1], [0, 0.42]]) { c.beginPath(); c.arc(ex * it.r, ey * it.r, it.r * 0.11, 0, 7); c.fillStyle = INK; c.fill(); }
    c.restore();
  } else if (it.kind === 'hedge') {
    drawHedge(c, it.x, it.base, it.w, it.h, 5);
  } else if (it.kind === 'gnome') {
    drawGnome(c, it.x, it.base, 1);
  } else if (it.kind === 'tree') {
    drawAppleTree(c, it.x, it.base, it.cy, it.r, 5);
  } else if (it.kind === 'sprinkler') {
    // Sadetin: suihku näkyy vain silloin, kun se myös työntää
    const tt = reducedMotion ? 0 : G.time, px = -it.uy, py = it.ux;
    if (it.active) {
      const hw = it.width / 2, he = hw + it.len * 0.18, ex = it.nx + it.ux * it.len, ey = it.ny + it.uy * it.len;
      pathPoly(c, [{ x: it.nx + px * 8, y: it.ny + py * 8 }, { x: ex + px * he, y: ey + py * he }, { x: ex - px * he, y: ey - py * he }, { x: it.nx - px * 8, y: it.ny - py * 8 }]);
      c.fillStyle = 'rgba(150,215,240,.26)'; c.fill();
      c.fillStyle = 'rgba(226,246,253,.95)';
      for (let i = 0; i < 22; i++) {
        const f = (tt * 1.7 + i / 22) % 1, sd = ((i * 37) % 11) / 5 - 1, wv = sd * (8 + he * f);
        c.beginPath(); c.arc(it.nx + it.ux * it.len * f + px * wv, it.ny + it.uy * it.len * f + py * wv, 6 - f * 3, 0, 7); c.fill();
      }
    }
    c.lineCap = 'round';
    c.beginPath(); c.moveTo(it.x, it.base); c.lineTo(it.x, it.base - 20); c.lineWidth = 11; c.strokeStyle = INK; c.stroke(); c.lineWidth = 5; c.strokeStyle = '#8b97a3'; c.stroke();
    rrect(c, it.x - 14, it.base - 34, 28, 16, 6); c.fillStyle = it.active ? '#35b6d9' : '#3fb86a'; c.fill(); inkStroke(c, 4);
  } else if (it.kind === 'cactus') {
    drawCactus(c, it.x, it.base, it.h, it.w, 5);
  } else if (it.kind === 'cloud') {
    // Pomppupilvi: kumpuileva yläreuna, litteä pohja
    const n = Math.max(3, Math.round(it.w / 46)), cs = [];
    for (let i = 0; i < n; i++) cs.push([it.x - it.w / 2 + 26 + i * (it.w - 52) / (n - 1), it.y - 2 - (i % 2 ? 7 : 0), 27 + (i % 2 ? 5 : 0)]);
    c.lineWidth = 10; c.strokeStyle = INK; c.lineJoin = 'round';
    for (const [x, y, r] of cs) { c.beginPath(); c.arc(x, y, r, 0, 7); c.stroke(); }
    rrect(c, it.x - it.w / 2, it.y - 4, it.w, 29, 14); c.stroke();
    c.fillStyle = '#ffffff'; c.fill();
    for (const [x, y, r] of cs) { c.beginPath(); c.arc(x, y, r, 0, 7); c.fill(); }
    c.beginPath(); c.moveTo(it.x - it.w / 2 + 22, it.y + 13); c.lineTo(it.x + it.w / 2 - 22, it.y + 13); c.lineWidth = 5; c.strokeStyle = '#dfe9ff'; c.lineCap = 'round'; c.stroke();
  }
}

/* Heilurin painon väri maailmoittain (viidakossa kookospähkinä) */
const BOB = { desert: '#c96a42', sea: '#8a6fd8', mountain: '#bfe9fb', cloud: '#ffd95e', garden: '#d0763f' };

/* Korien ulkoasu koon mukaan: puuämpäri ×1, punoskori ×2, punainen ×3, kultainen ×5, violetti maljakko ×10 */
const STYLE = {
  L:  { fill: '#9a6a44', band: '#8b97a3' },
  M:  { fill: '#d6ab5e', weave: true },
  S:  { fill: '#e8493c', band: '#ffd92e' },
  XS: { fill: '#ffd92e', band: '#e8493c' },
  XXS: { fill: '#8a5fd8', band: '#ffd92e' },   // kapea ×10-maljakko
};

function drawSlingBack(c) {
  const SL = CONFIG.sling, R = CONFIG.ramp, p = S.pouch.position;
  // Rampin tukijalat
  c.lineCap = 'round';
  for (const [xa, ya, xb, yb] of [[60, R.y + 10, 60, GY], [306, R.y + 10, 306, GY], [60, GY - 10, 306, R.y + 30]]) {
    c.beginPath(); c.moveTo(xa, ya); c.lineTo(xb, yb); c.lineWidth = 17; c.strokeStyle = INK; c.stroke(); c.lineWidth = 9; c.strokeStyle = '#c9a15a'; c.stroke();
  }
  // Lingon runko ja takahaara
  c.beginPath(); c.moveTo(SL.x, GY); c.lineTo(SL.x, 662); c.lineTo(SL.x - SL.prongGap / 2, SL.y - 6);
  c.lineWidth = 24; c.strokeStyle = INK; c.lineJoin = 'round'; c.stroke(); c.lineWidth = 15; c.strokeStyle = '#7a4a26'; c.stroke();
  drawBand(c, SL.x - SL.prongGap / 2, SL.y, p, '#8f2f22');
}
function drawBand(c, ax, ay, p, col) {
  const SL = CONFIG.sling, st = clamp(Math.hypot(p.x - SL.x, p.y - SL.y) / SL.maxPull, 0, 1), lw = 9 - 4.5 * st;
  c.beginPath(); c.moveTo(ax, ay); c.lineTo(p.x, p.y); c.lineCap = 'round';
  c.lineWidth = lw + 5; c.strokeStyle = INK; c.stroke(); c.lineWidth = lw; c.strokeStyle = col; c.stroke();
}
function drawRamp(c) {
  const R = CONFIG.ramp;
  rrect(c, R.x1, R.y, R.x2 - R.x1, R.thick, 6); c.fillStyle = '#c98a45'; c.fill(); inkStroke(c, 5);
  c.lineWidth = 3; c.strokeStyle = '#8a5326'; for (let x = 20; x < R.x2 - 20; x += 64) { c.beginPath(); c.moveTo(x, R.y + 3); c.lineTo(x, R.y + R.thick - 3); c.stroke(); }
}
function drawSlingFront(c, t) {
  const SL = CONFIG.sling, p = S.pouch.position;
  const dx = SL.x - p.x, dy = SL.y - p.y, d = Math.hypot(dx, dy);
  // Lyhyt suuntaviiva vedon aikana (ei lentorataa)
  if (S.held && d >= SL.minPull) {
    const ux = dx / d, uy = dy / d, len = 46 + 64 * d / SL.maxPull;
    c.setLineDash([10, 9]); c.beginPath(); c.moveTo(SL.x + ux * 22, SL.y + uy * 22); c.lineTo(SL.x + ux * (22 + len), SL.y + uy * (22 + len));
    c.lineWidth = 6; c.strokeStyle = 'rgba(255,243,208,.9)'; c.lineCap = 'round'; c.stroke(); c.setLineDash([]);
  }
  // Etuhaara
  c.beginPath(); c.moveTo(SL.x, 664); c.lineTo(SL.x + SL.prongGap / 2, SL.y - 6);
  c.lineWidth = 22; c.strokeStyle = INK; c.lineCap = 'round'; c.stroke(); c.lineWidth = 13; c.strokeStyle = '#9a6233'; c.stroke();
  drawBand(c, SL.x + SL.prongGap / 2, SL.y, p, '#b53a2a');
  // Pussi piirretään viimeisenä, jotta se näkyy aina
  c.save(); c.translate(p.x, p.y); c.rotate(d > 4 ? Math.atan2(dy, dx) : 0);
  c.beginPath(); c.ellipse(0, 0, 13, 17, 0, 0, 7); c.fillStyle = '#6b4320'; c.fill(); inkStroke(c, 4.5);
  c.beginPath(); c.ellipse(-2, 0, 5, 10, 0, 0, 7); c.fillStyle = '#c98a45'; c.fill();
  c.restore();
  // Tarttumisvihje ennen tason alkua
  if (G.phase === 'wait') {
    const k = reducedMotion ? 0.5 : 0.5 + 0.5 * Math.sin(t * 5);
    c.beginPath(); c.arc(p.x, p.y, 30 + k * 12, 0, 7); c.lineWidth = 5; c.strokeStyle = 'rgba(255,243,208,' + (0.9 - k * 0.5) + ')'; c.stroke();
  }
}

function render(t) {
  const c = ctx;
  c.setTransform(1, 0, 0, 1, 0, 0);
  if (bg.width) c.drawImage(bg, 0, 0); else { c.fillStyle = '#f08a24'; c.fillRect(0, 0, canvas.width, canvas.height); }
  let sx = 0, sy = 0; if (G.shake > 0 && !reducedMotion) { sx = Math.sin(t * 90) * G.shake * 14; sy = Math.cos(t * 70) * G.shake * 10; }
  c.setTransform(V.s * V.dpr, 0, 0, V.s * V.dpr, (V.ox + sx * V.s) * V.dpr, (V.oy + sy * V.s) * V.dpr);

  ambient(c, t);

  drawSlingBack(c);
  drawRamp(c);
  for (const it of L.items) drawItem(c, it);
  for (const k of L.buckets) drawBucketBack(c, k, '#3a2416');

  // Lentovana
  for (let i = 0; i < G.trail.length; i++) { const p = G.trail[i], f = (i + 1) / G.trail.length; c.beginPath(); c.arc(p.x, p.y, 3 + 5 * f, 0, 7); c.fillStyle = 'rgba(255,243,208,' + (0.08 + 0.42 * f) + ')'; c.fill(); }
  for (const g of G.ghosts) drawBanana(c, g.x, g.y, g.a, clamp(g.life / g.max, 0, 1), g.curl, g.wave, false, t);
  if (G.banana) drawBanana(c, G.banana.position.x, G.banana.position.y, G.banana.angle, 1, G.flex.curl, G.flex.wave, true, t);

  for (const k of L.buckets) drawBucketFront(c, k, STYLE[k.size]);
  drawSlingFront(c, t);
  if (G.banana && G.bstate === 'flying' && G.phase === 'play') drawBananaValue(c);

  for (const p of G.particles) {
    c.save(); c.globalAlpha = clamp(p.life / p.max * 1.6, 0, 1); c.translate(p.x, p.y); c.rotate(p.r); c.fillStyle = p.c;
    if (p.confetti) { c.fillRect(-p.s / 2, -p.s / 4, p.s, p.s / 2); } else { c.beginPath(); c.arc(0, 0, p.s / 2, 0, 7); c.fill(); }
    c.restore();
  }
  c.textAlign = 'center'; c.textBaseline = 'middle'; c.lineJoin = 'round';
  for (const p of G.popups) {
    const a = clamp(p.life / p.max * 2.2, 0, 1), k = 1 + 0.25 * clamp(1 - (p.max - p.life) * 6, 0, 1);
    c.globalAlpha = a; c.font = (p.size * k) + 'px "Lilita One","Arial Rounded MT Bold",system-ui,sans-serif';
    c.lineWidth = 9; c.strokeStyle = INK; c.strokeText(p.text, p.x, p.y); c.fillStyle = p.color; c.fillText(p.text, p.x, p.y); c.globalAlpha = 1;
  }
  drawWinScore(c, t);
}

/* =====================================================================
   Pääsilmukka: fysiikka kiinteällä aika-askeleella, piirto ruudun tahdissa
   ===================================================================== */
let lastT = 0, acc = 0;
function frame(ms) {
  const now = ms / 1000, dt = Math.min(0.1, lastT ? now - lastT : 0); lastT = now;
  acc += dt; let n = 0;
  while (acc >= DT && n < 30) { step(); acc -= DT; n++; }
  if (n === 30) acc = 0;
  updateEffects(dt);
  render(now);
  requestAnimationFrame(frame);
}

$('btnScores').addEventListener('click', () => showScores(G.world));
$('btnBack').addEventListener('click', showMenu);
$('hMenu').addEventListener('click', showMenu);
$('nameInput').addEventListener('keydown', e => { if (e.key === 'Enter') $('cBtn').click(); });
resize();
loadLevel(0);   // ensimmäinen taso jää taustaksi aloitusruudun taakse
showMenu();
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => {}).catch(() => {});
requestAnimationFrame(frame);

// Kehitystä ja testausta varten
window.__banaanilinko = { CONFIG, ONLINE, WORLDS, G, S, L, store, startWorld, loadLevel, showMenu, showScores, showFinal, grab, dragTo, release, step };
})();
</script>
